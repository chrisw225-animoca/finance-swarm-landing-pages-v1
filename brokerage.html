<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bluepeak Brokerage – Market Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --blue-primary: #1434cb;
      --accent-cream: #fff6de;
      --neutral: #353535;
      --muted: #697086;
      --radius-lg: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", sans-serif; color: var(--neutral); background: #f7f8ff; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--blue-primary); }
    .panel { background: #fff; border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .chart-container { height: 250px; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    .pos { color: #0f9d58; font-weight: 600; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">Bluepeak Brokerage</div>
      <div class="pill">Finance1 Trusted</div>
    </header>
    <main>
      <section class="panel">
        <h2>Portfolio Performance</h2>
        <div class="pos">+18.2% YTD</div>
        <div class="chart-container"><canvas id="portfolioChart"></canvas></div>
      </section>
      <section class="panel" style="margin-top:20px;">
        <h2>Watchlist</h2>
        <table>
          <thead><tr><th>Symbol</th><th>Today</th><th>YTD</th></tr></thead>
          <tbody>
            <tr><td>NVDA</td><td class="pos">+1.9%</td><td class="pos">+42.8%</td></tr>
            <tr><td>MSFT</td><td class="pos">+0.7%</td><td class="pos">+18.4%</td></tr>
            <tr><td>AAPL</td><td class="pos">+0.1%</td><td class="pos">+9.6%</td></tr>
            <tr><td>SPY</td><td style="color:#d93025">-0.3%</td><td class="pos">+8.1%</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script>
    const ctx = document.getElementById('portfolioChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr'],
        datasets: [{ label: 'Value', data: [100, 105, 112, 118.2], borderColor: '#1434cb', fill: false }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  </script>
</body>
</html>
