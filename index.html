<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Global Wealth Management | Premier Private & Institutional Services</title>
  <style>
    :root {
      --brand-primary: #1434cb;
      --brand-primary-hover: #0d2181;
      --brand-accent: #1a1f71;
      --bg-page: #ffffff;
      --bg-card: #ffffff;
      --bg-feature-card: #fff6de;
      --bg-inverse: #181b1d;
      --text-primary: #1a1a1a;
      --text-secondary: #353535;
      --text-link: #1434cb;
      --border-subtle: #e1e4eb;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.08);
      --radius-card: 18px;
      --radius-pill: 999px;
      --transition-fast: 140ms ease-out;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #f2f4ff 0, #ffffff 55%, #f4f5f7 100%);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--text-link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 20px 72px;
    }

    /* Header */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 8px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-symbol {
      width: 32px;
      height: 32px;
      border-radius: 14px;
      background: conic-gradient(from 230deg, #001b7a, #1434cb, #5a78ff, #e2e7ff, #1434cb 85%, #001b7a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .brand-logo-symbol::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: radial-gradient(circle at 30% 0, rgba(255,255,255,0.9), transparent 55%);
      mix-blend-mode: screen;
    }

    .brand-logo-text {
      font-weight: 650;
      letter-spacing: 0.08em;
      font-size: 13px;
      text-transform: uppercase;
      color: #111827;
    }

    .brand-logo-text span {
      color: var(--brand-primary);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      color: #4b5563;
    }

    .nav-link {
      position: relative;
      padding-bottom: 4px;
      cursor: pointer;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: var(--brand-primary);
      transition: width var(--transition-fast);
    }

    .nav-link:hover::after {
      width: 18px;
    }

    .nav-link.is-active {
      color: #111827;
      font-weight: 600;
    }

    .nav-link.is-active::after {
      width: 22px;
    }

    .nav-cta {
      display: inline-flex;
      align-items: center; gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 11px;
      padding: 11px 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast), color var(--transition-fast);
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--brand-primary) 0, var(--brand-accent) 50%, #050b33 100%);
      color: #ffffff;
      box-shadow: 0 18px 22px rgba(12, 21, 91, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, var(--brand-primary-hover), var(--brand-accent));
      box-shadow: 0 18px 30px rgba(12, 21, 91, 0.45);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.0);
      color: #111827;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 0 0 rgba(0,0,0,0);
      backdrop-filter: blur(8px);
    }

    .btn-ghost:hover {
      background: rgba(248, 250, 252, 0.95);
    }

    .btn .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #8b5cf6;
    }

    /* Hero */
    .hero {
      padding: 32px 0 34px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.1fr);
      gap: 32px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 14px 40px rgba(15, 23, 42, 0.14);
      border: 1px solid rgba(15, 23, 42, 0.04);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      margin-bottom: 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #4b5563;
    }

    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 14px;
      background: radial-gradient(from 230deg, #001b7a, #1434cb, #5a78ff, #e2e7ff, #1434cb 85%, #001b7a 100%);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.25);
      position: relative;
      overflow: hidden;
    }

    .eyebrow-pill::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: radial-gradient(circle at 30% 0, rgba(255,255,255,0.9), transparent 55%);
      mix-blend-mode: screen;
    }

    .hero-title {
      font-size: clamp(2.4rem, 3vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      margin: 0 0 18px;
      color: #020617;
    }

    .hero-title span {
      color: var(--brand-primary);
    }

    .hero-subtile {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      max-width: 34rem;
      margin-bottom: 22px;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .hero-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding: 6px 12px;
      border-radius: 28px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.85);
      color: #4b5563;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .hero-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .hero-annotation {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #6b7280;
    }

    .hero-annotation-pill {
      padding: 4px 9px;
      border-radius: 1999px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
      font-size: 11x;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* Hero stats row */
    .hero-stat-row {
      display: flex;
      fle-wrap: wrap;
      gap: 18px;
      margin-top: 8px;
    }

    .hero-stat {
      min-width: 140px;
    }

    .hero-stat-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .hero-stat-value {
      font-size: 20px;
      font-weight: 650;
      color: #0f172a;
    }

    .hero-stat-detail {
      font-size: 11px;
      color: #6b7280;
    }

    /* Hero visual card */
    .hero-visual-card {
      position: relative;
      border-radius: 26px;
      background: linear-gradient(140deg, #020617 0, #020617 45%, #0b1120 70%, #020617 100%);
      color: #e5e7eb;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.65);
    }

    .hero-visual-card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0 0, rgba(59, 130, 246, 0.16) 0, transparent 55%),
        radial-gradient(circle at 100% 0, rgba(129, 140, 248, 0.2) 0, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.18) 0, transparent 55%);
      opacity: 0.9;
      pointer-events: none;
    }

    .hero-visual-inner {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      z-index: 1;
    }

    .hero-visual-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hero-visual-title-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hero-visual-eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .hero-visual-title {
      font-size: 14px;
      font-weight: 600;
      color: #e5e7eb;
    }

    .hero-visual-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.65);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .hero-visual-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.4);
    }

    .hero-visual-main {
      display: grid;
      grid-template-columns: 1.6fr 1.05fr;
      gap: 14px;
      align-items: stretch;
    }

      position: relative;

    .chart-title {

    .chart-period-pill {
      display: inline-flex;

    .chart-period-pill span.is-active {
      background: linear-gradient(135deg, #22c55e, #14b8a6);
