<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PingPay Social – Instant P2P</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --p: #1434cb; --a: #fff6de; }
    body { font-family: Inter, sans-serif; color: #353535; background: #f5f7fb; padding: 20px; }
    .card { max-width: 600px; margin: auto; background: #fff; padding: 24px; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
    h1 { color: var(--p); }
    .activity { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
    .item { display: flex; justify-content: space-between; padding: 8px 0; }
    .pos { color: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PingPay Social</h1>
    <p>Instant transfers. Trusted by friends.</p>
    <div class="activity">
      <h3>Recent Activity</h3>
      <div class="item"><span>You paid Alex</span><span style="color:#ef4444">-$24.00</span></div>
      <div class="item"><span>Maya paid you</span><span class="pos">+$18.50</span></div>
    </div>
  </div>
</body>
</html>
